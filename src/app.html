<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- No analytics tag here on purpose. gtag.js used to load from this document, which
		     put it on the page before the visitor had any say; it is now injected by
		     src/lib/consent.svelte.ts, and only after consent. -->
		<!-- Theme: follow the system unless the footer control has stored a choice. Runs before
		     first paint so a stored choice never flashes the other paper; without JS the
		     stylesheet's prefers-color-scheme rules decide on their own. -->
		<script>
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
