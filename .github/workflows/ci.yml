name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `check` runs `wrangler types --check`, which fails if the committed
      # worker-configuration.d.ts is out of sync with wrangler.jsonc, then
      # type-checks the Svelte components.
      - run: npm run check

      - run: npm run build
