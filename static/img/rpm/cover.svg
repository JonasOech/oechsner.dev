<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A three-by-three matrix of abstract glyphs with the final cell empty">
  <defs>
  </defs>

  <rect width="1200" height="675" fill="#fefefe"/>

  <g transform="translate(390 105)" stroke="#5a5a5a" fill="none" stroke-width="2">
    <!-- row 1 -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <circle cx="65" cy="65" r="34"/>
    </g>
    <g transform="translate(145 0)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <circle cx="65" cy="65" r="34"/>
      <circle cx="65" cy="65" r="16"/>
    </g>
    <g transform="translate(290 0)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <circle cx="65" cy="65" r="34"/>
      <circle cx="65" cy="65" r="16"/>
      <circle cx="65" cy="65" r="5" fill="#5a5a5a"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(0 145)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <rect x="33" y="33" width="64" height="64"/>
    </g>
    <g transform="translate(145 145)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <rect x="33" y="33" width="64" height="64"/>
      <rect x="49" y="49" width="32" height="32"/>
    </g>
    <g transform="translate(290 145)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <rect x="33" y="33" width="64" height="64"/>
      <rect x="49" y="49" width="32" height="32"/>
      <rect x="60" y="60" width="10" height="10" fill="#5a5a5a"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(0 290)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <path d="M65 28 105 100 25 100Z"/>
    </g>
    <g transform="translate(145 290)">
      <rect x="0" y="0" width="130" height="130" stroke="#e2e2e2"/>
      <path d="M65 28 105 100 25 100Z"/>
      <path d="M65 56 88 96 42 96Z"/>
    </g>
    <!-- the answer cell, left open -->
    <g transform="translate(290 290)">
      <rect x="0" y="0" width="130" height="130" stroke="#9d4125" stroke-dasharray="6 6" opacity="0.85"/>
      <text x="65" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
            font-size="46" fill="#9d4125" stroke="none" opacity="0.9">?</text>
    </g>
  </g>
</svg>
