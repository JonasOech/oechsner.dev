<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A generated sentence where only the last word is lit, above a word graph whose weighted arrows give the probabilities of the next word">
  <defs>
    <radialGradient id="mkGlowA" cx="12%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#2f4a6b" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#2f4a6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mkGlowB" cx="88%" cy="92%" r="65%">
      <stop offset="0%" stop-color="#1d4d42" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#1d4d42" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mkDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1d211f" opacity="0.05"/>
    </pattern>

    <marker id="mkArrowPast" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5"
            markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#46698c"/>
    </marker>
    <marker id="mkArrowIdle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5"
            markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8a8a7d"/>
    </marker>
    <marker id="mkArrowNext" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2c6a5c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f4f2ec"/>
  <rect width="1200" height="675" fill="url(#mkDots)"/>

  <!-- The sentence so far. Every word before the last one has already been forgotten:
       the model sees exactly one token of context. -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" text-anchor="middle">
    <g fill="#faf9f5" stroke="#a7a393" stroke-width="2">
      <rect x="291" y="80" width="80" height="44" rx="6" opacity="0.35"/>
      <rect x="387" y="80" width="146" height="44" rx="6" opacity="0.45"/>
      <rect x="549" y="80" width="72" height="44" rx="6" opacity="0.6"/>
      <rect x="637" y="80" width="80" height="44" rx="6" opacity="0.75"/>
    </g>
    <text x="331" y="109" fill="#3a403c" opacity="0.2">the</text>
    <text x="460" y="109" fill="#3a403c" opacity="0.3">gradient</text>
    <text x="585" y="109" fill="#3a403c" opacity="0.4">of</text>
    <text x="677" y="109" fill="#3a403c" opacity="0.55">the</text>

    <rect x="733" y="80" width="96" height="44" rx="6" fill="#ebe8de" stroke="#2c6a5c" stroke-width="2"/>
    <text x="781" y="109" fill="#2c6a5c">loss</text>

    <rect x="845" y="80" width="64" height="44" rx="6" fill="none" stroke="#2c6a5c" stroke-width="2"
          stroke-dasharray="6 6" opacity="0.7"/>
    <text x="877" y="109" fill="#2c6a5c" opacity="0.8">?</text>
  </g>
  <text x="781" y="64" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1"
        text-anchor="middle" fill="#2c6a5c" opacity="0.8">context = 1</text>

  <!-- Transitions nobody is taking right now. -->
  <g fill="none" stroke="#a7a393" stroke-width="2" marker-end="url(#mkArrowIdle)">
    <path d="M858 570Q790 604 728 602"/>
    <path d="M676 578Q652 400 612 258"/>
    <path d="M534 512Q600 560 654 594"/>
  </g>

  <!-- The walk that produced the sentence: the → gradient → of → the → loss. -->
  <g fill="none" stroke="#46698c" stroke-width="2.5" opacity="0.55" marker-end="url(#mkArrowPast)">
    <path d="M560 236Q420 250 354 322"/>
    <path d="M338 376Q368 470 462 496"/>
    <path d="M508 474Q538 330 590 258"/>
    <path d="M640 236Q780 250 846 322"/>
  </g>

  <!-- Where it can go from "loss". Stroke width is the transition probability. -->
  <g fill="none" stroke="#2c6a5c" stroke-linecap="round" marker-end="url(#mkArrowNext)">
    <path d="M902 376Q932 452 922 530" stroke-width="5"/>
    <path d="M864 376Q800 500 718 574" stroke-width="3.5"/>
    <path d="M838 370Q680 420 540 492" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#2c6a5c">
    <text x="938" y="460">0.52</text>
    <text x="770" y="500" text-anchor="end">0.31</text>
    <text x="760" y="380" text-anchor="middle">0.17</text>
  </g>

  <!-- The states. -->
  <g fill="#ebe8de" stroke="#3a403c" stroke-width="2">
    <rect x="562" y="208" width="76" height="44" rx="22"/>
    <rect x="258" y="328" width="124" height="44" rx="22"/>
    <rect x="468" y="478" width="64" height="44" rx="22"/>
    <rect x="858" y="538" width="124" height="44" rx="22"/>
    <rect x="658" y="578" width="64" height="44" rx="22"/>
  </g>
  <rect x="838" y="328" width="84" height="44" rx="22" fill="#ebe8de" stroke="#2c6a5c" stroke-width="3"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="middle" fill="#3a403c">
    <text x="600" y="236">the</text>
    <text x="320" y="356">gradient</text>
    <text x="500" y="506">of</text>
    <text x="920" y="566">function</text>
    <text x="690" y="606">is</text>
    <text x="880" y="356" fill="#2c6a5c">loss</text>
  </g>
</svg>
