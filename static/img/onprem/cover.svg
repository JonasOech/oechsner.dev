<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three stacked containers inside a closed boundary, with one arrow blocked at the edge">
  <defs>
    <radialGradient id="opGlowA" cx="80%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#a65a2e" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a65a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="opGlowB" cx="10%" cy="92%" r="65%">
      <stop offset="0%" stop-color="#6b86a6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6b86a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="opDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f1d1a" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#f4f1ea"/>

  <!-- the network boundary -->
  <rect x="180" y="130" width="620" height="420" rx="10" fill="#ebe7dc" fill-opacity="0.75"
        stroke="#cbc4b3" stroke-width="2"/>
  <text x="205" y="168" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8a8478"
        letter-spacing="2">on-premise</text>

  <!-- three containers -->
  <g stroke="#6b665c" stroke-width="2" fill="none">
    <rect x="228" y="215" width="240" height="86" rx="6" fill="#fbf9f5"/>
    <rect x="228" y="325" width="240" height="86" rx="6" fill="#fbf9f5"/>
    <rect x="228" y="435" width="240" height="86" rx="6" fill="#fbf9f5"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#6b665c">
    <text x="252" y="265">web</text>
    <text x="252" y="375">postgres</text>
    <text x="252" y="485">ollama</text>
  </g>

  <!-- internal links -->
  <g stroke="#2a5985" stroke-width="2" opacity="0.75">
    <path d="M348 301v24" />
    <path d="M348 411v24" />
  </g>
  <g fill="#2a5985" opacity="0.75">
    <path d="M348 331l-5-9h10z"/>
    <path d="M348 441l-5-9h10z"/>
  </g>

  <!-- the blocked egress -->
  <g stroke="#8a8478" stroke-width="2" stroke-dasharray="7 7">
    <path d="M560 365h190"/>
  </g>
  <g stroke="#a5322d" stroke-width="3" stroke-linecap="round">
    <path d="M786 341l40 48M826 341l-40 48"/>
  </g>
  <text x="866" y="372" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8a8478">internet</text>
</svg>
