<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three stacked containers inside a closed boundary, with one arrow blocked at the edge">
  <defs>
  </defs>

  <rect width="1200" height="675" fill="#fefefe"/>

  <!-- the network boundary -->
  <rect x="180" y="130" width="620" height="420" rx="10" fill="#f5f5f5" fill-opacity="0.75"
        stroke="#cacaca" stroke-width="2"/>
  <text x="205" y="168" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8d8d8d"
        letter-spacing="2">on-premise</text>

  <!-- three containers -->
  <g stroke="#5a5a5a" stroke-width="2" fill="none">
    <rect x="228" y="215" width="240" height="86" rx="6" fill="#ffffff"/>
    <rect x="228" y="325" width="240" height="86" rx="6" fill="#ffffff"/>
    <rect x="228" y="435" width="240" height="86" rx="6" fill="#ffffff"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#5a5a5a">
    <text x="252" y="265">web</text>
    <text x="252" y="375">postgres</text>
    <text x="252" y="485">ollama</text>
  </g>

  <!-- internal links -->
  <g stroke="#9d4125" stroke-width="2" opacity="0.75">
    <path d="M348 301v24" />
    <path d="M348 411v24" />
  </g>
  <g fill="#9d4125" opacity="0.75">
    <path d="M348 331l-5-9h10z"/>
    <path d="M348 441l-5-9h10z"/>
  </g>

  <!-- the blocked egress -->
  <g stroke="#8d8d8d" stroke-width="2" stroke-dasharray="7 7">
    <path d="M560 365h190"/>
  </g>
  <g stroke="#a94628" stroke-width="3" stroke-linecap="round">
    <path d="M786 341l40 48M826 341l-40 48"/>
  </g>
  <text x="866" y="372" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8d8d8d">internet</text>
</svg>
