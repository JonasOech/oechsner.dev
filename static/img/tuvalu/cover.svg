<!--
  The flag of Tuvalu on the site's standard cover background. Flag geometry and colours are from
  Wikimedia Commons, "Flag of Tuvalu.svg" (a flag: no copyright restriction); the nine stars stand for
  the nine islands. Drawn 6x its 120x60 source, centred inside the 4:3 crop the article cards show.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The flag of Tuvalu: a light blue field with the Union Jack in the upper left corner and nine yellow stars on the right, one for each island">
  <defs>
    <radialGradient id="tvGlowA" cx="12%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#4a5fb0" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#4a5fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tvGlowB" cx="88%" cy="92%" r="65%">
      <stop offset="0%" stop-color="#b06c2e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#b06c2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tvFlagGlow">
      <stop offset="0%" stop-color="#009cde" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#009cde" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tvDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f4f4f6" opacity="0.05"/>
    </pattern>
    <filter id="tvShadow" x="-20%" y="-35%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <path id="tvStarUp" d="m0-5.2573 3.0902 9.5106L-5-1.6246H5l-8.0902 5.8779z"/>
    <path id="tvStarDown" d="m0 5.2573-3.0902-9.5106L5 1.6246H-5l8.0902-5.8779z"/>
    <clipPath id="tvFlagClip"><path d="m0 0h120v60H0z"/></clipPath>
    <clipPath id="tvCantonClip"><path d="m0 0v15h62v16zm0 30v1h30V0h30z"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="#0e0f12"/>
  <rect width="1200" height="675" fill="url(#tvDots)"/>
  <rect width="1200" height="675" fill="url(#tvGlowA)"/>
  <rect width="1200" height="675" fill="url(#tvGlowB)"/>
  <ellipse cx="600" cy="337" rx="520" ry="330" fill="url(#tvFlagGlow)"/>

  <!-- Shadow, then the flag. -->
  <rect x="246" y="186" width="708" height="360" fill="#000" opacity="0.6" filter="url(#tvShadow)"/>
  <g transform="translate(240 157.5) scale(6)" fill="#fedd00">
    <path fill="#012169" d="m0 0h120v60H0z"/>
    <g clip-path="url(#tvFlagClip)" fill="none" stroke="#c8102e" stroke-width="6">
      <path stroke="#fff" d="m0 0 60 30M0 30 60 0"/>
      <path stroke-width="4" clip-path="url(#tvCantonClip)" d="m0 0 60 30M0 30 60 0"/>
      <path stroke="#fff" stroke-width="10" d="m30 0v31M0 15h62"/>
      <path d="m30 0v31M0 15h62"/>
    </g>
    <path fill="#009cde" d="m60 0h60v60H0V30h60z"/>
    <use xlink:href="#tvStarUp" x="65.5" y="54"/>
    <use xlink:href="#tvStarDown" x="78" y="38.5"/>
    <use xlink:href="#tvStarDown" x="78" y="51"/>
    <use xlink:href="#tvStarDown" x="90.5" y="21.5"/>
    <use xlink:href="#tvStarDown" x="90.5" y="47.5"/>
    <use xlink:href="#tvStarDown" x="101" y="17.5"/>
    <use xlink:href="#tvStarUp" x="101" y="38.5"/>
    <use xlink:href="#tvStarUp" x="111.5" y="8"/>
    <use xlink:href="#tvStarUp" x="111.5" y="32"/>
  </g>
  <rect x="240.5" y="158" width="719" height="359" fill="none" stroke="#f4f4f6" stroke-opacity="0.14"/>
</svg>
