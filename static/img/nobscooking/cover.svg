<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A geometric bull's head above a recipe drawn as a nested table, where columns of ingredients merge step by step into a single final cell">
  <defs>
    <radialGradient id="nbGlowA" cx="14%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#ba7766" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ba7766" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nbGlowB" cx="88%" cy="92%" r="65%">
      <stop offset="0%" stop-color="#8f3a24" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8f3a24" stop-opacity="0"/>
    </radialGradient>
    <!-- The halo that lifts the mark off the table behind it. -->
    <radialGradient id="nbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a85a42" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a85a42" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nbDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c1a17" opacity="0.05"/>
    </pattern>

    <!-- Bone horns, ember head: lit from the upper left like every other cover. -->
    <linearGradient id="nbHorn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#685b41"/>
      <stop offset="100%" stop-color="#3f341d"/>
    </linearGradient>
    <linearGradient id="nbHead" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#a0553a"/>
      <stop offset="100%" stop-color="#cf9084"/>
    </linearGradient>
    <linearGradient id="nbSnout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c67f6e"/>
      <stop offset="100%" stop-color="#dbaba2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#f6f1e7"/>

  <!-- The recipe as Cooking for Engineers draws it: ingredient cells on the left
       merging column by column until one cell is left. Three cells are lit to
       trace a single ingredient all the way to the finished dish. -->
  <g fill="none" stroke="#b8ae98" stroke-width="2">
    <rect x="262" y="452" width="170" height="26" rx="4"/>
    <rect x="262" y="484" width="170" height="26" rx="4"/>
    <rect x="262" y="516" width="170" height="26" rx="4"/>
    <rect x="262" y="548" width="170" height="26" rx="4"/>
    <rect x="262" y="580" width="170" height="26" rx="4"/>
    <rect x="262" y="612" width="170" height="26" rx="4"/>

    <rect x="444" y="452" width="150" height="58" rx="4"/>
    <rect x="444" y="516" width="150" height="58" rx="4"/>
    <rect x="444" y="580" width="150" height="58" rx="4"/>

    <rect x="606" y="452" width="150" height="122" rx="4"/>
    <rect x="606" y="580" width="150" height="58" rx="4"/>
  </g>
  <!-- Short rules inside the ingredient cells stand in for their names. -->
  <g stroke="#b8ae98" stroke-width="3" stroke-linecap="round">
    <path d="M280 465h84"/>
    <path d="M280 529h96"/>
    <path d="M280 561h72"/>
    <path d="M280 625h88"/>
  </g>

  <g fill="none" stroke="#7b1e2b" stroke-width="3">
    <rect x="262" y="484" width="170" height="26" rx="4"/>
    <rect x="444" y="452" width="150" height="58" rx="4"/>
    <rect x="606" y="452" width="150" height="122" rx="4"/>
    <rect x="768" y="452" width="170" height="186" rx="5"/>
  </g>
  <g stroke="#7b1e2b" stroke-width="3" stroke-linecap="round">
    <path d="M280 497h104"/>
  </g>

  <!-- The bull. Horns are one crescent mirrored about the centre line so the
       silhouette stays symmetrical. -->
  <circle cx="600" cy="272" r="164" fill="url(#nbCore)"/>

  <g fill="url(#nbHorn)">
    <path d="M534 216c-58-2-118 0-162-24-38-21-48-56-32-78 10-14 26-10 24 4-5 30 18 50 52 60 44 13 90 15 128 10z"/>
    <path d="M666 216c58-2 118 0 162-24 38-21 48-56 32-78-10-14-26-10-24 4 5 30-18 50-52 60-44 13-90 15-128 10z" />
  </g>

  <!-- Ears, tucked under the horn roots. -->
  <g fill="url(#nbSnout)">
    <path d="M536 224c-26 4-46 18-52 36 14 10 38 2 52-14z"/>
    <path d="M664 224c26 4 46 18 52 36-14 10-38 2-52-14z"/>
  </g>

  <path fill="url(#nbHead)" d="M532 212c26-12 110-12 136 0 8 74-2 134-32 172-16 20-24 32-36 32s-20-12-36-32c-30-38-40-98-32-172z"/>
  <path fill="url(#nbSnout)" d="M566 348c12-6 56-6 68 0 1 18-5 30-14 38-6 6-11 9-20 9s-14-3-20-9c-9-8-15-20-14-38z"/>

  <!-- Eyes and nostrils are punched out of the mark, not drawn on top of it. -->
  <g fill="#f6f1e7">
    <path d="M552 268c10-6 22-6 30 2-8 8-22 8-30-2z"/>
    <path d="M648 268c-10-6-22-6-30 2 8 8 22 8 30-2z"/>
    <ellipse cx="587" cy="371" rx="6.5" ry="8"/>
    <ellipse cx="613" cy="371" rx="6.5" ry="8"/>
  </g>
</svg>
