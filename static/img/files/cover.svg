<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A stack of markdown files fanned out above a rendered page">

  <rect width="1200" height="675" fill="#f6f1e6"/>

  <!-- fanned source files -->
  <g>
    <rect x="300" y="150" width="260" height="330" rx="8" fill="#fbf8f0" stroke="#d9d0bb" stroke-width="2"
          transform="rotate(-9 430 315)"/>
    <rect x="340" y="140" width="260" height="330" rx="8" fill="#fbf8f0" stroke="#b5a98b" stroke-width="2"
          transform="rotate(-3 470 305)"/>
    <rect x="380" y="132" width="260" height="330" rx="8" fill="#fbf8f0" stroke="#b5a98b" stroke-width="2"/>
  </g>

  <!-- front-matter block -->
  <g stroke="#8a6a2c" stroke-width="2" opacity="0.7">
    <path d="M404 164h212"/>
    <path d="M404 236h212"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8a6a2c" opacity="0.9">
    <text x="404" y="192">title:</text>
    <text x="404" y="216">date:</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b3750">
    <text x="470" y="192">a post</text>
    <text x="470" y="216">2026-08-28</text>
  </g>

  <!-- body lines -->
  <g stroke="#b5a98b" stroke-width="7" stroke-linecap="round">
    <path d="M404 266h196"/>
    <path d="M404 292h212"/>
    <path d="M404 318h164"/>
    <path d="M404 356h212"/>
    <path d="M404 382h134"/>
    <path d="M404 420h188"/>
  </g>

  <!-- build arrow -->
  <g stroke="#2b3750" stroke-width="2">
    <path d="M676 300h104"/>
  </g>
  <path d="M786 300l-11-6v12z" fill="#2b3750"/>
  <text x="676" y="282" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#596378">build</text>

  <!-- rendered page -->
  <rect x="806" y="152" width="230" height="296" rx="8" fill="#fbf8f0" stroke="#b5a98b" stroke-width="2"/>
  <g stroke="#14203b" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M834 196h150"/>
  </g>
  <g stroke="#b5a98b" stroke-width="6" stroke-linecap="round">
    <path d="M834 232h174"/>
    <path d="M834 254h150"/>
    <path d="M834 276h168"/>
    <path d="M834 310h174"/>
    <path d="M834 332h122"/>
    <path d="M834 366h160"/>
    <path d="M834 388h140"/>
  </g>
</svg>
