<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The Obsidian logo at the centre of a note graph, with links radiating outwards to connected notes">
  <defs>
    <radialGradient id="obGlowA" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#1b5e4b" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#1b5e4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="obGlowB" cx="86%" cy="90%" r="65%">
      <stop offset="0%" stop-color="#134a3a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#134a3a" stop-opacity="0"/>
    </radialGradient>
    <!-- The halo that lifts the mark off the graph behind it. -->
    <radialGradient id="obCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f7a63" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#2f7a63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="obDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#17181a" opacity="0.05"/>
    </pattern>

    <!-- One gradient per facet of the mark, lit from the upper left. -->
    <linearGradient id="obFacetT" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3c8a72"/>
      <stop offset="100%" stop-color="#8fbfae"/>
    </linearGradient>
    <linearGradient id="obFacetM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7a63"/>
      <stop offset="100%" stop-color="#1b5e4b"/>
    </linearGradient>
    <linearGradient id="obFacetL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17503f"/>
      <stop offset="100%" stop-color="#0f3a2e"/>
    </linearGradient>
    <linearGradient id="obFacetD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#134a3a"/>
      <stop offset="100%" stop-color="#0b2c23"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#f3f1ec"/>

  <!-- Links out of the mark. Every ray starts clear of the facets so the
       silhouette stays sharp; three are lit to trace one path through the vault. -->
 
  <!-- The Obsidian mark itself: the four facets of the official logo, drawn on
       its native 24px grid and scaled up about the centre of the graph. -->
  <g transform="translate(484.32 222.8) scale(9.6)">
    <!-- Upper-left facet: the tall one that catches the light. -->
    <path fill="url(#obFacetT)" d="M9.32 14.01c.615-.183 1.606-.465 2.745-.534-.683-1.725-.848-3.233-.716-4.577.154-1.552.7-2.847 1.235-3.95.113-.235.223-.454.328-.664.149-.297.288-.577.419-.86.217-.47.379-.885.46-1.27.08-.38.08-.72-.014-1.043-.095-.325-.297-.675-.68-1.06a1.6 1.6 0 0 0-1.475.36l-4.95 4.452a1.602 1.602 0 0 0-.513.952l-.427 2.83c.672.59 2.328 2.316 3.335 4.711.09.21.175.43.253.653z"/>
    <!-- Upper-right facet. -->
    <path fill="url(#obFacetM)" d="M19.355 18.538a68.967 68.959 0 0 0 1.858-2.954.81.81 0 0 0-.062-.9c-.516-.685-1.504-2.075-2.042-3.362-.553-1.321-.636-3.375-.64-4.377a1.707 1.707 0 0 0-.358-1.05l-3.198-4.064a3.744 3.744 0 0 1-.076.543c-.106.503-.307 1.004-.536 1.5-.134.29-.29.6-.446.914l-.31.626c-.516 1.068-.997 2.227-1.132 3.59-.124 1.26.046 2.73.815 4.481.128.011.257.025.386.044a6.363 6.363 0 0 1 3.326 1.505c.916.79 1.744 1.922 2.415 3.5z"/>
    <!-- Lower-left facet, turned away from the light. -->
    <path fill="url(#obFacetL)" d="M5.533 9.938c-.023.1-.056.197-.098.29L2.82 16.059a1.602 1.602 0 0 0 .313 1.772l4.116 4.24c2.103-3.101 1.796-6.02.836-8.3-.728-1.73-1.832-3.081-2.55-3.831z"/>
    <!-- Bottom facet, the darkest. -->
    <path fill="url(#obFacetD)" d="M8.199 22.569c.073.012.146.02.22.02.78.024 2.095.092 3.16.29.87.16 2.593.64 4.01 1.055 1.083.316 2.198-.548 2.355-1.664.114-.814.33-1.735.725-2.58l-.01.005c-.67-1.87-1.522-3.078-2.416-3.849a5.295 5.295 0 0 0-2.778-1.257c-1.54-.216-2.952.19-3.84.45.532 2.218.368 4.829-1.425 7.531z"/>
  </g>
</svg>
