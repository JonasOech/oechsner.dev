<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A stack of ruled lecture notes feeding into a grid of model weights where only a scattered few cells are lit">
  <defs>
  </defs>

  <rect width="1200" height="675" fill="#f4f1ea"/>

  <!-- The vault: three pages of notes, the back two fanned out behind the front one. -->
  <g transform="translate(146 168)">
    <g transform="rotate(-7 130 180)">
      <rect x="26" y="16" width="212" height="300" rx="8" fill="#e3ded2"/>
    </g>
    <g transform="rotate(-3 130 180)">
      <rect x="16" y="8" width="212" height="300" rx="8" fill="#d6d1c5"/>
    </g>
    <rect x="4" y="0" width="216" height="304" rx="8" fill="#fbfaf6" stroke="#8a8679" stroke-width="2"/>
    <!-- Ruled lines. One line is lit: the note that made it into the training set. -->
    <g stroke="#b9b4a6" stroke-width="5" stroke-linecap="round">
      <path d="M32 44h140"/>
      <path d="M32 76h160"/>
      <path d="M32 140h152"/>
      <path d="M32 172h120"/>
      <path d="M32 204h160"/>
      <path d="M32 236h104"/>
      <path d="M32 268h144"/>
    </g>
    <path stroke="#243f8f" stroke-width="6" stroke-linecap="round" d="M32 108h132"/>
  </g>

  <!-- The notes flowing into the weights. -->
  <g fill="none" stroke="#243f8f" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M400 250C486 250 512 214 596 214"/>
    <path d="M400 322C492 322 508 338 596 338"/>
    <path d="M400 394C486 394 512 446 596 446"/>
  </g>

  <!-- The weight grid. Almost all of it is frozen; a scattered few cells move,
       which is the whole shape of a finetune. -->
  <g transform="translate(636 148)">
    <g fill="#ebe7de" stroke="#b9b4a6" stroke-width="2">
      <rect x="0" y="0" width="46" height="46" rx="6"/><rect x="58" y="0" width="46" height="46" rx="6"/><rect x="116" y="0" width="46" height="46" rx="6"/><rect x="174" y="0" width="46" height="46" rx="6"/><rect x="232" y="0" width="46" height="46" rx="6"/><rect x="290" y="0" width="46" height="46" rx="6"/><rect x="348" y="0" width="46" height="46" rx="6"/>
      <rect x="0" y="58" width="46" height="46" rx="6"/><rect x="58" y="58" width="46" height="46" rx="6"/><rect x="116" y="58" width="46" height="46" rx="6"/><rect x="174" y="58" width="46" height="46" rx="6"/><rect x="232" y="58" width="46" height="46" rx="6"/><rect x="290" y="58" width="46" height="46" rx="6"/><rect x="348" y="58" width="46" height="46" rx="6"/>
      <rect x="0" y="116" width="46" height="46" rx="6"/><rect x="58" y="116" width="46" height="46" rx="6"/><rect x="116" y="116" width="46" height="46" rx="6"/><rect x="174" y="116" width="46" height="46" rx="6"/><rect x="232" y="116" width="46" height="46" rx="6"/><rect x="290" y="116" width="46" height="46" rx="6"/><rect x="348" y="116" width="46" height="46" rx="6"/>
      <rect x="0" y="174" width="46" height="46" rx="6"/><rect x="58" y="174" width="46" height="46" rx="6"/><rect x="116" y="174" width="46" height="46" rx="6"/><rect x="174" y="174" width="46" height="46" rx="6"/><rect x="232" y="174" width="46" height="46" rx="6"/><rect x="290" y="174" width="46" height="46" rx="6"/><rect x="348" y="174" width="46" height="46" rx="6"/>
      <rect x="0" y="232" width="46" height="46" rx="6"/><rect x="58" y="232" width="46" height="46" rx="6"/><rect x="116" y="232" width="46" height="46" rx="6"/><rect x="174" y="232" width="46" height="46" rx="6"/><rect x="232" y="232" width="46" height="46" rx="6"/><rect x="290" y="232" width="46" height="46" rx="6"/><rect x="348" y="232" width="46" height="46" rx="6"/>
      <rect x="0" y="290" width="46" height="46" rx="6"/><rect x="58" y="290" width="46" height="46" rx="6"/><rect x="116" y="290" width="46" height="46" rx="6"/><rect x="174" y="290" width="46" height="46" rx="6"/><rect x="232" y="290" width="46" height="46" rx="6"/><rect x="290" y="290" width="46" height="46" rx="6"/><rect x="348" y="290" width="46" height="46" rx="6"/>
    </g>

    <g fill="#243f8f">
      <rect x="58" y="0" width="46" height="46" rx="6"/>
      <rect x="232" y="58" width="46" height="46" rx="6"/>
      <rect x="0" y="116" width="46" height="46" rx="6"/>
      <rect x="174" y="174" width="46" height="46" rx="6"/>
      <rect x="348" y="232" width="46" height="46" rx="6"/>
      <rect x="116" y="290" width="46" height="46" rx="6"/>
    </g>
    <g fill="#9c3e27">
      <rect x="290" y="116" width="46" height="46" rx="6"/>
      <rect x="58" y="232" width="46" height="46" rx="6"/>
      <rect x="232" y="290" width="46" height="46" rx="6"/>
    </g>
  </g>
</svg>
